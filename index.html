<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empaquetado de Rectángulos (ancho fijo)</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    body {
      margin: 0;
      padding: 24px;
      background: #f6f7fb;
      color: #222;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
      grid-template-columns: 360px 1fr;
      align-items: start;
    }
    .panel, .result {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      padding: 16px;
    }
    label {
      font-weight: 600;
      display: block;
      margin: 8px 0 6px;
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      border: 1px solid #ccd2df;
      border-radius: 8px;
      padding: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    th, td {
      border: 1px solid #d7ddea;
      padding: 6px;
      text-align: left;
    }
    th {
      background: #f8fafc;
      font-size: 0.9rem;
    }
    td input {
      width: 100%;
      margin: 0;
      padding: 8px;
      border-radius: 6px;
    }
    .actions-col {
      width: 92px;
      text-align: center;
    }
    .row-delete-btn {
      width: auto;
      margin: 0;
      padding: 6px 10px;
      border-radius: 6px;
      background: #dc2626;
      font-weight: 600;
    }
    .row-delete-btn:hover {
      background: #b91c1c;
    }
    button {
      margin-top: 12px;
      border: none;
      background: #1f6feb;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover {
      background: #185bcc;
    }
    #status {
      margin-top: 10px;
      min-height: 1.3em;
      font-size: 0.95rem;
    }
    #status.error { color: #b00020; }
    #status.ok { color: #08660f; }
    canvas {
      width: 100%;
      max-height: 75vh;
      background: #fff;
      border: 1px solid #d5dbeb;
      border-radius: 10px;
    }
    .meta {
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: #475569;
    }
    code {
      background: #eef2ff;
      padding: 2px 6px;
      border-radius: 6px;
    }
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="panel">
      <h2>Configuración</h2>
      <label for="fixedWidth">Ancho fijo del contenedor (w0)</label>
      <input id="fixedWidth" type="number" min="1" value="12" />

      <label>Tipos de rectángulos</label>
      <table>
        <thead>
          <tr>
            <th>Alto</th>
            <th>Ancho</th>
            <th>Cantidad</th>
            <th class="actions-col">Acciones</th>
          </tr>
        </thead>
        <tbody id="rectanglesTableBody"></tbody>
      </table>

      <button id="addRowBtn" type="button">Agregar fila</button>

      <button id="solveBtn">Optimizar acomodo</button>
      <div id="status"></div>
    </section>

    <section class="result">
      <h2>Resultado</h2>
      <div id="meta" class="meta">Ingresa datos y pulsa <code>Optimizar acomodo</code>.</div>
      <canvas id="canvas" width="900" height="600"></canvas>
    </section>
  </div>

  <script>
    const fixedWidthInput = document.getElementById('fixedWidth');
    const rectanglesTableBody = document.getElementById('rectanglesTableBody');
    const addRowBtn = document.getElementById('addRowBtn');
    const solveBtn = document.getElementById('solveBtn');
    const statusEl = document.getElementById('status');
    const metaEl = document.getElementById('meta');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    addRowBtn.addEventListener('click', () => addRectangleRow());
    solveBtn.addEventListener('click', run);

    addRectangleRow({ h: 3, w: 5, qty: 1 });
    addRectangleRow({ h: 2, w: 3, qty: 1 });
    addRectangleRow({ h: 4, w: 4, qty: 1 });

    function run() {
      try {
        statusEl.className = '';
        statusEl.textContent = 'Calculando...';

        const w0 = Number(fixedWidthInput.value);
        if (!Number.isFinite(w0) || w0 <= 0) throw new Error('w0 debe ser un número positivo.');

        const rects = getRectanglesFromTable();

        for (const r of rects) {
          if (Math.min(r.w, r.h) > w0 && Math.max(r.w, r.h) > w0) {
            throw new Error(`El rectángulo #${r.id + 1} no cabe en el ancho fijo ${w0}, ni rotándolo.`);
          }
        }

        const solution = optimizePacking(rects, w0);
        if (!solution) {
          throw new Error('No se encontró un acomodo exacto dentro de los límites de búsqueda.');
        }

        statusEl.className = 'ok';
        statusEl.textContent = 'Acomodo encontrado.';

        const areaTotal = rects.reduce((sum, r) => sum + r.area, 0);
        const utilization = (100 * areaTotal / (w0 * solution.height)).toFixed(2);

        metaEl.textContent = `Altura mínima encontrada (hx): ${solution.height}. Aprovechamiento: ${utilization}% (${areaTotal}/${w0 * solution.height}). Huecos conectados: ${solution.metrics.emptyRegions}.`;
        drawPacking(w0, solution.height, solution.placements);
      } catch (err) {
        statusEl.className = 'error';
        statusEl.textContent = err.message;
        metaEl.textContent = 'No se pudo calcular la solución.';
        clearCanvas();
      }
    }

    function addRectangleRow(values = {}) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="number" min="1" step="1" class="rect-h" value="${values.h ?? ''}" /></td>
        <td><input type="number" min="1" step="1" class="rect-w" value="${values.w ?? ''}" /></td>
        <td><input type="number" min="1" step="1" class="rect-qty" value="${values.qty ?? ''}" /></td>
        <td class="actions-col"><button type="button" class="row-delete-btn">Eliminar</button></td>
      `;
      const deleteBtn = tr.querySelector('.row-delete-btn');
      deleteBtn.addEventListener('click', () => removeRectangleRow(tr));
      rectanglesTableBody.appendChild(tr);
    }

    function removeRectangleRow(row) {
      const rows = [...rectanglesTableBody.querySelectorAll('tr')];
      if (rows.length <= 1) {
        row.querySelector('.rect-h').value = '';
        row.querySelector('.rect-w').value = '';
        row.querySelector('.rect-qty').value = '';
        return;
      }
      row.remove();
    }

    function getRectanglesFromTable() {
      const rows = [...rectanglesTableBody.querySelectorAll('tr')];
      if (rows.length === 0) throw new Error('Agrega al menos una fila de rectángulos.');

      const rects = [];

      for (let rowIndex = 0; rowIndex < rows.length; rowIndex += 1) {
        const row = rows[rowIndex];
        const hInput = row.querySelector('.rect-h');
        const wInput = row.querySelector('.rect-w');
        const qtyInput = row.querySelector('.rect-qty');
        const h = Number(hInput.value);
        const w = Number(wInput.value);
        const qty = Number(qtyInput.value);

        const isBlank = hInput.value.trim() === '' && wInput.value.trim() === '' && qtyInput.value.trim() === '';
        if (isBlank) continue;

        if (!Number.isFinite(w) || !Number.isFinite(h) || w <= 0 || h <= 0) {
          throw new Error(`La fila #${rowIndex + 1} tiene alto/ancho inválido.`);
        }
        if (!Number.isInteger(qty) || qty <= 0) {
          throw new Error(`La fila #${rowIndex + 1} tiene una cantidad inválida.`);
        }

        for (let count = 0; count < qty; count += 1) {
          rects.push({ id: rects.length, w, h, area: w * h });
        }
      }

      if (rects.length === 0) {
        throw new Error('No hay rectángulos válidos para procesar.');
      }

      return rects;
    }

    function optimizePacking(rects, w0) {
      const lowerBound = Math.max(
        Math.ceil(rects.reduce((sum, r) => sum + r.area, 0) / w0),
        Math.max(...rects.map((r) => Math.min(r.w, r.h)))
      );
      const upperBound = greedyUpperBound(rects, w0);

      let best = null;
      let lo = lowerBound;
      let hi = upperBound;

      while (lo <= hi) {
        const mid = Math.floor((lo + hi) / 2);
        const attempt = canPack(rects, w0, mid);
        if (attempt) {
          const refined = refinePacking(rects, w0, mid, attempt);
          best = {
            height: mid,
            placements: refined.placements,
            metrics: refined.metrics
          };
          hi = mid - 1;
        } else {
          lo = mid + 1;
        }
      }
      return best;
    }

    function greedyUpperBound(rects, w0) {
      const sorted = [...rects].sort((a, b) => b.area - a.area);
      let y = 0;
      let rowHeight = 0;
      let rowWidth = 0;

      for (const r of sorted) {
        const options = [[r.w, r.h], [r.h, r.w]].filter(([w]) => w <= w0);
        options.sort((a, b) => a[1] - b[1]);

        let placed = false;
        for (const [w, h] of options) {
          if (rowWidth + w <= w0) {
            rowWidth += w;
            rowHeight = Math.max(rowHeight, h);
            placed = true;
            break;
          }
        }

        if (!placed) {
          y += rowHeight;
          rowHeight = 0;
          rowWidth = 0;
          const best = options[0];
          if (!best) throw new Error(`No hay orientación posible para el rectángulo #${r.id + 1}.`);
          rowWidth = best[0];
          rowHeight = best[1];
        }
      }
      return y + rowHeight;
    }

    function canPack(rects, w0, H) {
      const items = [...rects].sort((a, b) => b.area - a.area || b.h - a.h || b.w - a.w);
      const placed = [];
      const unplaced = new Set(items.map((r) => r.id));

      function search() {
        if (unplaced.size === 0) return true;

        // Poda segura por capacidad total: evita descartar configuraciones válidas con huecos.
        const usedArea = placed.reduce((sum, p) => sum + p.w * p.h, 0);
        const remainingArea = [...unplaced].reduce((sum, id) => sum + rects[id].area, 0);
        if (usedArea + remainingArea > w0 * H) return false;

        const next = items.find((r) => unplaced.has(r.id));
        const orientations = [];
        orientations.push([next.w, next.h]);
        if (next.w !== next.h) orientations.push([next.h, next.w]);

        const xs = [0, ...placed.map((p) => p.x + p.w)].filter((x, i, arr) => x <= w0 && arr.indexOf(x) === i).sort((a, b) => a - b);
        const ys = [0, ...placed.map((p) => p.y + p.h)].filter((y, i, arr) => y <= H && arr.indexOf(y) === i).sort((a, b) => a - b);

        for (const [w, h] of orientations) {
          if (w > w0 || h > H) continue;
          for (const y of ys) {
            if (y + h > H) break;
            for (const x of xs) {
              if (x + w > w0) break;
              if (overlapsAny(x, y, w, h, placed)) continue;

              placed.push({ id: next.id, x, y, w, h });
              unplaced.delete(next.id);

              if (search()) return true;

              unplaced.add(next.id);
              placed.pop();
            }
          }
        }
        return false;
      }

      const ok = search();
      return ok ? [...placed] : null;
    }

    function refinePacking(rects, w0, H, initialPlacements) {
      const items = [...rects].sort((a, b) => b.area - a.area || b.h - a.h || b.w - a.w);
      const placed = [];
      const unplaced = new Set(items.map((r) => r.id));
      const totalArea = rects.reduce((sum, r) => sum + r.area, 0);
      const minPossibleEmptyRegions = totalArea === w0 * H ? 0 : 1;
      const startedAt = now();
      const timeBudgetMs = 250;

      let bestPlacements = [...initialPlacements];
      let bestMetrics = measureEmptySpace(w0, H, bestPlacements);
      let timedOut = false;

      function search() {
        if (timedOut || bestMetrics.emptyRegions === minPossibleEmptyRegions) return;
        if (now() - startedAt > timeBudgetMs) {
          timedOut = true;
          return;
        }

        if (unplaced.size === 0) {
          const metrics = measureEmptySpace(w0, H, placed);
          if (compareLayoutMetrics(metrics, bestMetrics) < 0) {
            bestMetrics = metrics;
            bestPlacements = [...placed];
          }
          return;
        }

        const nextState = selectMostConstrainedItem(items, unplaced, placed, w0, H);
        if (!nextState || nextState.candidates.length === 0) return;

        const rankedCandidates = nextState.candidates
          .map((candidate) => ({
            candidate,
            metrics: measureEmptySpace(w0, H, [...placed, candidate])
          }))
          .sort((a, b) => compareLayoutMetrics(a.metrics, b.metrics) || comparePlacementOrder(a.candidate, b.candidate));

        unplaced.delete(nextState.item.id);
        for (const entry of rankedCandidates) {
          placed.push(entry.candidate);
          search();
          placed.pop();
          if (timedOut || bestMetrics.emptyRegions === minPossibleEmptyRegions) break;
        }
        unplaced.add(nextState.item.id);
      }

      search();
      return { placements: bestPlacements, metrics: bestMetrics };
    }

    function selectMostConstrainedItem(items, unplaced, placed, w0, H) {
      let best = null;

      for (const item of items) {
        if (!unplaced.has(item.id)) continue;
        const candidates = buildPlacementCandidates(item, placed, w0, H);
        if (!best || candidates.length < best.candidates.length || (candidates.length === best.candidates.length && item.area > best.item.area)) {
          best = { item, candidates };
        }
        if (best && best.candidates.length <= 1) break;
      }

      return best;
    }

    function buildPlacementCandidates(rect, placed, w0, H) {
      const candidates = [];
      const seen = new Set();
      const orientations = getOrientations(rect);
      const xs = [0, ...placed.map((p) => p.x + p.w)]
        .filter((x, index, arr) => x <= w0 && arr.indexOf(x) === index)
        .sort((a, b) => a - b);
      const ys = [0, ...placed.map((p) => p.y + p.h)]
        .filter((y, index, arr) => y <= H && arr.indexOf(y) === index)
        .sort((a, b) => a - b);

      for (const [w, h] of orientations) {
        if (w > w0 || h > H) continue;
        for (const y of ys) {
          if (y + h > H) break;
          for (const x of xs) {
            if (x + w > w0) break;
            if (overlapsAny(x, y, w, h, placed)) continue;

            const key = `${x}:${y}:${w}:${h}`;
            if (seen.has(key)) continue;
            seen.add(key);
            candidates.push({ id: rect.id, x, y, w, h });
          }
        }
      }

      return candidates;
    }

    function getOrientations(rect) {
      return rect.w === rect.h ? [[rect.w, rect.h]] : [[rect.w, rect.h], [rect.h, rect.w]];
    }

    function measureEmptySpace(w0, H, placements) {
      const xs = uniqueSorted([0, w0, ...placements.flatMap((p) => [p.x, p.x + p.w])]);
      const ys = uniqueSorted([0, H, ...placements.flatMap((p) => [p.y, p.y + p.h])]);
      const xIndex = new Map(xs.map((value, index) => [value, index]));
      const yIndex = new Map(ys.map((value, index) => [value, index]));
      const rows = ys.length - 1;
      const cols = xs.length - 1;
      const occupied = Array.from({ length: rows }, () => Array(cols).fill(false));
      const visited = Array.from({ length: rows }, () => Array(cols).fill(false));

      for (const p of placements) {
        const x0 = xIndex.get(p.x);
        const x1 = xIndex.get(p.x + p.w);
        const y0 = yIndex.get(p.y);
        const y1 = yIndex.get(p.y + p.h);

        for (let yi = y0; yi < y1; yi += 1) {
          for (let xi = x0; xi < x1; xi += 1) {
            occupied[yi][xi] = true;
          }
        }
      }

      const regionAreas = [];
      const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];

      for (let yi = 0; yi < rows; yi += 1) {
        for (let xi = 0; xi < cols; xi += 1) {
          if (occupied[yi][xi] || visited[yi][xi]) continue;

          let area = 0;
          const stack = [[xi, yi]];
          visited[yi][xi] = true;

          while (stack.length > 0) {
            const [cx, cy] = stack.pop();
            area += (xs[cx + 1] - xs[cx]) * (ys[cy + 1] - ys[cy]);

            for (const [dx, dy] of directions) {
              const nx = cx + dx;
              const ny = cy + dy;
              if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
              if (occupied[ny][nx] || visited[ny][nx]) continue;
              visited[ny][nx] = true;
              stack.push([nx, ny]);
            }
          }

          regionAreas.push(area);
        }
      }

      const largestEmptyArea = regionAreas.length > 0 ? Math.max(...regionAreas) : 0;
      const squaredEmptyAreaSum = regionAreas.reduce((sum, area) => sum + area * area, 0);

      return {
        emptyRegions: regionAreas.length,
        largestEmptyArea,
        squaredEmptyAreaSum
      };
    }

    function compareLayoutMetrics(a, b) {
      return (a.emptyRegions - b.emptyRegions)
        || (b.largestEmptyArea - a.largestEmptyArea)
        || (b.squaredEmptyAreaSum - a.squaredEmptyAreaSum);
    }

    function comparePlacementOrder(a, b) {
      return (a.y - b.y) || (a.x - b.x) || (b.h - a.h) || (b.w - a.w);
    }

    function uniqueSorted(values) {
      return [...new Set(values)].sort((a, b) => a - b);
    }

    function now() {
      return typeof performance !== 'undefined' && typeof performance.now === 'function'
        ? performance.now()
        : Date.now();
    }

    function overlapsAny(x, y, w, h, placed) {
      for (const p of placed) {
        const noOverlap = x + w <= p.x || p.x + p.w <= x || y + h <= p.y || p.y + p.h <= y;
        if (!noOverlap) return true;
      }
      return false;
    }

    function drawPacking(w0, h0, placements) {
      clearCanvas();
      const pad = 24;
      const availableW = canvas.width - pad * 2;
      const availableH = canvas.height - pad * 2;
      const scale = Math.min(availableW / w0, availableH / h0);

      const drawW = w0 * scale;
      const drawH = h0 * scale;
      const ox = (canvas.width - drawW) / 2;
      const oy = (canvas.height - drawH) / 2;

      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 2;
      ctx.strokeRect(ox, oy, drawW, drawH);

      for (const p of placements) {
        const x = ox + p.x * scale;
        const y = oy + p.y * scale;
        const w = p.w * scale;
        const h = p.h * scale;
        const hue = (p.id * 47) % 360;
        ctx.fillStyle = `hsl(${hue} 70% 75%)`;
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = `hsl(${hue} 65% 40%)`;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, w, h);

        ctx.fillStyle = '#0f172a';
        ctx.font = '12px sans-serif';
        ctx.fillText(`#${p.id + 1} (${p.w}×${p.h})`, x + 4, y + 14);
      }
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    clearCanvas();
  </script>
</body>
</html>
